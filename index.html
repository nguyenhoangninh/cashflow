<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c2b36">
  <meta name="description" content="Dự báo dòng tiền và kế hoạch thanh toán SVL">
  <title>SVL Cashflow – Realtime</title>
  
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <!-- SheetJS (xlsx 0.18.5), vendored so the app works without a CDN. Used only to read the .xlsm import. -->
  <script src="vendor/xlsx.full.min.js" defer></script>
</head>
<body>
  <div id="app"><div class="loading">Đang tải…</div></div>
  <noscript>Cần bật JavaScript để dùng ứng dụng này.</noscript>
  <script>
    // Distinguish slow/failed JavaScript module loading from a Firebase sign-in screen.
    window.setTimeout(() => {
      const app = document.getElementById('app');
      if (app && app.querySelector('.loading')) {
        app.innerHTML = '<div class="loading" style="padding:2rem;line-height:1.7">'
          + '<b>Không thể khởi động SVL Cashflow Realtime.</b>'
          + '<p>Trình duyệt chưa tải xong ứng dụng. Vui lòng thử Ctrl + F5 hoặc kiểm tra kết nối Internet/Firebase.</p>'
          + '<button type="button" id="rt-retry">Tải lại</button></div>';
        document.getElementById('rt-retry').addEventListener('click', () => location.reload());
      }
    }, 18000);
  </script>
  <script>
    // Retire old offline-only service worker to prevent stale local Cashflow shell.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs =>
        Promise.all(regs.filter(r => r.scope.includes('/cashflow/')).map(r => r.unregister()))
      ).catch(() => {});
    }
    if ('caches' in window) {
      caches.keys().then(keys => Promise.all(keys.filter(k => k.startsWith('svl-cashflow-shell-'))
        .map(k => caches.delete(k)))).catch(() => {});
    }
  </script>
  <script type="module" src="js/app.js?v=single-realtime-20261117"></script>
</body>
</html>
